<body>
<header>
<small>TIC 9.º ano · Folha de cálculo</small>
<h1>Excel Lab - Diagnóstico</h1>
<p>Descobre o que já sabes sobre o Excel e o que ainda precisas de praticar.</p>
</header>
<main class="wrap">
<section class="panel">
<div class="topline"><div><b>Progresso</b><div class="muted" id="progressText"></div></div><div style="flex:1;min-width:240px"><div class="track"><div id="progress" style="width:0"></div></div></div></div>
<div class="gamebar screen-only" id="gamebar"></div><div id="missions" class="missions screen-only"></div><nav id="nav" style="display:none"></nav>
<div id="page"></div>
<div class="controls" style="margin-top:18px">
<div class="legend"><span>Sem ajuda</span><span>Sem pesquisar</span><span>Responde ao teu ritmo</span></div>
<div class="no-print"><button class="secondary" id="back">Anterior</button><button id="next">Seguinte</button><button class="secondary" id="reset">Reiniciar</button></div>
</div>
</section>
</main>
<script>
const levels=['Nunca utilizei','Reconheço, mas não sei aplicar','Consigo com ajuda','Consigo sozinho'];
const conceptLevels=['Não conheço','Já ouvi falar','Identifico pela imagem','Identifico e explico'];
const topics=['Gerir livros e ficheiros','Inserir dados em tabelas','Formatar células','Formatação condicional','Gerir folhas','Utilizar fórmulas','Utilizar funções','Criar gráficos'];
const funcs=[['SOMA','Somar valores'],['MÉDIA','Calcular a média'],['MÁXIMO','Encontrar o maior valor'],['MÍNIMO','Encontrar o menor valor'],['CONTAR','Contar células com números'],['CONTAR.VAL','Contar células preenchidas'],['SE','Tomar uma decisão com base numa condição'],['CONTAR.SE','Contar valores que cumprem um critério'],['SOMA.SE','Somar valores que cumprem um critério'],['ARRED','Arredondar um número'],['HOJE','Obter a data atual'],['PROCV','Procurar um valor numa tabela']];
const names=['Identificação','O que conheço','Galeria visual','Explorar o Excel','Fórmulas e funções','Desafios de aplicação','Relatório'];const missionIcons=['🚀','🧭','🔍','🧩','⚙️','🎯','🏁'];const missionTitles=['Preparar a missão','Descobrir competências','Detetive visual','Explorador da folha','Mestre das fórmulas','Desafio final','Relatório'];
const concepts=[
  {name:'Célula',desc:'A caixa individual onde inserimos dados.',art:'cell'},
  {name:'Linha',desc:'Conjunto horizontal de células.',art:'row'},
  {name:'Coluna',desc:'Conjunto vertical de células.',art:'col'},
  {name:'Intervalo',desc:'Grupo de várias células selecionadas.',art:'range'},
  {name:'Referência',desc:'Identificação de uma célula, por exemplo C3.',art:'ref'},
  {name:'Livro',desc:'O ficheiro Excel aberto.',art:'workbook'},
  {name:'Ficheiro',desc:'Documento guardado com extensão .xlsx.',art:'file'},
  {name:'Folha',desc:'Separador onde estão os dados.',art:'sheet'},
  {name:'Barra de fórmulas',desc:'Zona onde vemos ou editamos o conteúdo.',art:'formula'},
  {name:'Caixa de nome',desc:'Mostra a referência da célula ativa.',art:'namebox'},
  {name:'Função',desc:'Fórmula pronta, como SOMA ou MÉDIA.',art:'function'},
  {name:'Gráfico',desc:'Representação visual dos dados.',art:'chart'}
];
const visualQs=[
  ['g1','Gerir folhas','Que elemento está destacado a verde?',['Célula','Linha','Coluna','Livro'],'Célula','cell'],
  ['g2','Gerir folhas','Que elemento está destacado a amarelo?',['Linha','Coluna','Intervalo','Folha'],'Linha','row'],
  ['g3','Gerir folhas','Que elemento está destacado a amarelo?',['Coluna','Barra de fórmulas','Função','Ficheiro'],'Coluna','col'],
  ['g4','Gerir folhas','Como se chama o conjunto destacado?',['Intervalo','Gráfico','Filtro','Livro'],'Intervalo','range'],
  ['g5','Gerir livros e ficheiros','O que está identificado no topo da janela?',['Folha','Livro','Linha','Célula'],'Livro','workbook'],
  ['g6','Gerir livros e ficheiros','O que representa este ícone/documento?',['Função','Ficheiro .xlsx','Folha ativa','Referência'],'Ficheiro .xlsx','file'],
  ['g7','Utilizar funções','Qual é a função mostrada?',['SOMA','MÉDIA','SE','PROCV'],'SOMA','function'],
  ['g8','Gerir folhas','Que zona permite mudar de folha?',['Caixa de nome','Folhas / separadores','Barra de fórmulas','Filtro'],'Folhas / separadores','sheet'],
  ['g9','Utilizar fórmulas','O que mostra a caixa verde do lado esquerdo da barra?',['O nome do livro','A referência da célula','O gráfico ativo','O formato da célula'],'A referência da célula','namebox'],
  ['g10','Criar gráficos','Que elemento está representado?',['Tabela','Gráfico','Intervalo','Fórmula'],'Gráfico','chart']
];
const qs=[
  ['v1','Gerir folhas','Qual é o endereço da célula selecionada?',['B3','C2','C3','3C'],'C3'],
  ['v2','Gerir folhas','Clica no cabeçalho da coluna D.',null,'D'],
  ['v3','Gerir folhas','Clica no número da linha 4.',null,'4'],
  ['v4','Gerir folhas','Qual é a referência do intervalo amarelo?',['A2:B3','A2:B4','A1:B4','B2:A4'],'A2:B4'],
  ['v5','Gerir livros e ficheiros','Qual é o nome do livro (ficheiro)?',['Orçamento.xlsx','Despesas','Resumo','C3'],'Orçamento.xlsx'],
  ['v6','Gerir folhas','Qual é a folha ativa?',['Orçamento.xlsx','Despesas','Resumo','Dados'],'Despesas'],
  ['v7','Gerir folhas','Que elemento permite adicionar uma folha?',['fx','+','C3','Guardar'],'+'],
  ['f1','Utilizar fórmulas','Qual destas expressões é uma fórmula válida?',['B2*C2','=B2*C2','B2 x C2','=B2:C2'],'=B2*C2'],
  ['f2','Utilizar fórmulas','Ao copiar =B2*C2 uma linha abaixo, o que acontece?',['=B2*C2','=B3*C3','=C2*D2','=B2*C3'],'=B3*C3'],
  ['f3','Utilizar fórmulas','Qual é uma referência absoluta?',['A1','$A$1','A$1','$A1'],'$A$1'],
  ['f4','Utilizar funções','Que função calcula o valor médio?',['SOMA','MÁXIMO','MÉDIA','CONTAR'],'MÉDIA'],
  ['f5','Utilizar funções','Que função permite testar uma condição?',['SE','SOMA','MÍNIMO','HOJE'],'SE'],
  ['a1','Inserir dados em tabelas','Qual dos seguintes valores é um número adequado para cálculos?',['12 euros','doze','12','12 alunos'],'12'],
  ['a2','Formatar células','Que formato aplicarias ao preço de um produto?',['Data','Moeda','Percentagem','Texto'],'Moeda'],
  ['a3','Formatar células','Como deve aparecer 0,25 com formato percentagem?',['0,25%','25%','250%','2,5%'],'25%'],
  ['a4','Formatação condicional','Como destacar automaticamente despesas superiores a 20 €?',['Cor manual','Formatação condicional','Ordenar','Inserir imagem'],'Formatação condicional'],
  ['a5','Criar gráficos','Qual o gráfico mais adequado para comparar despesas por categoria?',['Colunas','Dispersão','Mapa','Nenhum'],'Colunas'],
  ['a6','Criar gráficos','Observa o gráfico: qual a categoria com maior despesa?',['Material','Transporte','Alimentação'],'Transporte'],
  ['a7','Gerir livros e ficheiros','Qual extensão corresponde a um livro Excel moderno?',['.docx','.pptx','.xlsx','.jpg'],'.xlsx'],
  ['a8','Inserir dados em tabelas','Para mostrar apenas as despesas de transporte sem apagar as outras, utilizarias…',['Filtro','Eliminar linhas','Negrito','Zoom'],'Filtro']
];
const practical=[
  ['p1','Utilizar fórmulas','Escreve em D2 a fórmula para calcular o custo do material (quantidade × preço unitário).','=B2*C2'],
  ['p2','Utilizar funções','Escreve uma fórmula com função para somar os valores de D2 a D4.','=SOMA(D2:D4)'],
  ['p3','Utilizar funções','Escreve uma fórmula com função para calcular a média dos valores de D2 a D4.','=MÉDIA(D2:D4)']
];
let state={};try{state=JSON.parse(localStorage.getItem('excelLab9v3')||'{}')}catch{}
let step=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(k,v){state[k]=v;try{localStorage.setItem('excelLab9v3',JSON.stringify(state))}catch{}updateProgress()}
const allKeys=[...topics.map((_,i)=>'t'+i),...concepts.map((_,i)=>'c'+i),...funcs.map((_,i)=>'k'+i),...visualQs.map(q=>q[0]),...qs.map(q=>q[0]),...practical.map(q=>q[0]),'nome','turma','numero','experiencia','reflexao'];
const missionKeys=[['nome','turma','numero','experiencia'],topics.map((_,i)=>'t'+i),[...concepts.map((_,i)=>'c'+i),...visualQs.map(q=>q[0])],qs.slice(0,7).map(q=>q[0]),[...funcs.map((_,i)=>'k'+i),...qs.slice(7,12).map(q=>q[0])],[...practical.map(q=>q[0]),...qs.slice(12).map(q=>q[0]),'reflexao']];
const medals=['🚀 Preparação','🧭 Autoconhecimento','🔍 Detetive visual','🧩 Explorador','⚙️ Fórmulas','🎯 Desafio final'];
const answered=k=>state[k]!==undefined&&state[k]!==''&&state[k]!==null;
function missionDone(i){return missionKeys[i].every(answered)}
function updateProgress(){let n=allKeys.filter(answered).length, pct=Math.round(100*n/allKeys.length), completed=missionKeys.filter((_,i)=>missionDone(i)).length;$('progress').style.width=pct+'%';$('progressText').textContent=n+' de '+allKeys.length+' respostas registadas';$('gamebar').innerHTML=`<div class="gamebox"><small>⭐ XP de participação</small><b>${n*10} / ${allKeys.length*10}</b></div><div class="gamebox"><small>🏅 Missões concluídas</small><b>${completed}/6</b></div><div class="gamebox"><small>📈 Progresso</small><b>${pct}%</b></div>`;$('missions').innerHTML=names.map((name,i)=>`<button class="mission ${step===i?'active':''} ${i<6&&missionDone(i)?'done':''}" onclick="go(${i})"><strong>${missionIcons[i]}</strong>${i+1}. ${missionTitles[i]}<small>${i<6?missionKeys[i].filter(answered).length+'/'+missionKeys[i].length:'Relatório'}</small></button>`).join('')}

function radio(k,opts){return '<div class="options">'+[...opts,'Não sei'].map(v=>`<label><input type="radio" name="${k}" value="${esc(v)}" ${state[k]===v?'checked':''}>${esc(v)}</label>`).join('')+'</div>'}
function question(q){return `<div class="question"><strong>${esc(q[2])}</strong>${radio(q[0],q[3])}</div>`}
function matrix(items,prefix,opts){return items.map((a,i)=>`<div class="question"><strong>${esc(Array.isArray(a)?a[0]:a.name||a)}</strong>${Array.isArray(a)&&a[1]?`<div class="muted">${esc(a[1])}</div>`:''}${!Array.isArray(a)&&a.desc?`<div class="muted">${esc(a.desc)}</div>`:''}<select data-key="${prefix+i}"><option value="">Seleciona o teu nível</option>${opts.map((l,j)=>`<option value="${j}" ${state[prefix+i]===String(j)?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}
function originalArt(kind){const common=`viewBox="0 0 220 140" width="100%" height="130" aria-hidden="true"`;if(kind==='cell')return `<svg ${common}><rect x="20" y="18" width="180" height="104" rx="12" fill="#fff" stroke="#d0dfd7"/><g fill="#f2f7f4">${['0','1','2','3'].map((_,i)=>`<rect x="20" y="${18+i*26}" width="30" height="26" stroke="#d0dfd7"/>`).join('')}${['0','1','2','3'].map((_,i)=>`<rect x="${50+i*38}" y="18" width="38" height="26" stroke="#d0dfd7"/>`).join('')}</g>${[0,1,2].map(r=>[0,1,2].map(c=>`<rect x="${50+c*38}" y="${44+r*26}" width="38" height="26" fill="#fff" stroke="#d0dfd7"/>`).join('')).join('')}<rect x="88" y="70" width="38" height="26" fill="#d9f1e4" stroke="#217346" stroke-width="3"/><text x="107" y="128" text-anchor="middle" font-size="13" fill="#1d5b47">Célula ativa</text></svg>`;
if(kind==='row')return `<svg ${common}><rect x="20" y="18" width="180" height="104" rx="12" fill="#fff" stroke="#d0dfd7"/>${[0,1,2,3].map(i=>`<rect x="20" y="${18+i*26}" width="180" height="26" fill="${i===2?'#fff3b4':'#fff'}" stroke="#d0dfd7"/>`).join('')}${[0,1,2,3].map(i=>`<text x="35" y="${36+i*26}" text-anchor="middle" font-size="12" fill="#45665b">${i+1}</text>`).join('')}<text x="110" y="128" text-anchor="middle" font-size="13" fill="#1d5b47">Linha destacada</text></svg>`;
if(kind==='col')return `<svg ${common}><rect x="20" y="18" width="180" height="104" rx="12" fill="#fff" stroke="#d0dfd7"/>${[0,1,2,3].map(i=>`<rect x="${20+i*45}" y="18" width="45" height="104" fill="${i===2?'#fff3b4':'#fff'}" stroke="#d0dfd7"/>`).join('')}${['A','B','C','D'].map((t,i)=>`<text x="${42.5+i*45}" y="36" text-anchor="middle" font-size="12" fill="#45665b">${t}</text>`).join('')}<text x="110" y="128" text-anchor="middle" font-size="13" fill="#1d5b47">Coluna destacada</text></svg>`;
if(kind==='range')return `<svg ${common}><rect x="20" y="18" width="180" height="104" rx="12" fill="#fff" stroke="#d0dfd7"/>${[0,1,2,3].map(r=>[0,1,2,3].map(c=>`<rect x="${30+c*40}" y="${28+r*20}" width="40" height="20" fill="${r>=1&&r<=2&&c>=1&&c<=2?'#fff3b4':'#fff'}" stroke="#d0dfd7"/>`).join('')).join('')}<rect x="70" y="48" width="80" height="40" fill="none" stroke="#217346" stroke-width="3"/><text x="110" y="128" text-anchor="middle" font-size="13" fill="#1d5b47">Intervalo selecionado</text></svg>`;

function conceptCard(c,i){return `<div class="vcard"><div class="art">${art(c.art)}</div><h4>${esc(c.name)}</h4><select data-key="c${i}"><option value="">Indica o teu nível</option>${conceptLevels.map((l,j)=>`<option value="${j}" ${state['c'+i]===String(j)?'selected':''}>${l}</option>`).join('')}</select></div>`}
function visualQuestion(q){return `<div class="galleryQ"><div class="art">${art(q[5],true)}</div><div><strong>${esc(q[2])}</strong><div class="muted" style="margin:6px 0 12px">Observa a imagem e escolhe a opção correta.</div>${radio(q[0],q[3])}</div></div>`}
function sheet(mode='normal'){return `<div class="sheet"><div class="ribbon"><b>▦ Excel</b><span>Orçamento.xlsx</span><span>— □ ×</span></div><div class="tabsX">Ficheiro　 Base　 Inserir　 Fórmulas　 Dados　 Rever</div><div class="formula"><span>C3　▾</span> fx　<span>15</span></div><table><tr><th>◩</th>${['A','B','C','D','E'].map(c=>`<th ${mode==='v2'?`class="pick ${state.v2===c?'chosen':''}" tabindex="0" role="button" data-pick="v2" data-val="${c}"`:''}>${c}</th>`).join('')}</tr>${[['Categoria','Quantidade','Preço','Total',''],['Material',3,8,24,''],['Transporte',2,15,30,''],['Alimentação',5,4,20,''],['','','','','']].map((row,i)=>`<tr><th ${mode==='v3'?`class="pick ${state.v3===String(i+1)?'chosen':''}" tabindex="0" role="button" data-pick="v3" data-val="${i+1}"`:''}>${i+1}</th>${row.map((v,j)=>`<td class="${mode==='normal'&&i===2&&j===2?'selected':''} ${mode==='range'&&i>=1&&i<=3&&j<=1?'mark':''}">${v}</td>`).join('')}</tr>`).join('')}</table><div class="tabsX">‹　›　 <b style="border-bottom:3px solid #217346">Despesas</b>　　 Resumo　　 ＋</div></div>`}
function chart(){return `<svg viewBox="0 0 420 210" role="img" aria-label="Gráfico de colunas de despesas: material 24 euros, transporte 30 euros, alimentação 20 euros" style="max-width:480px;width:100%;background:#f5f9f6;border-radius:12px"><text x="210" y="24" text-anchor="middle" font-size="14" fill="#173b35">Despesas por categoria (€)</text><path d="M45 40V165H400" fill="none" stroke="#527566"/>${[0,10,20,30].map(n=>`<text x="35" y="${169-n*4}" font-size="11" text-anchor="end">${n}</text><path d="M45 ${165-n*4}H400" stroke="#d1ddd6"/>`).join('')}${[24,30,20].map((v,i)=>`<rect x="${78+i*112}" y="${165-v*4}" width="58" height="${v*4}" rx="4" fill="#217346"/><text x="${107+i*112}" y="${158-v*4}" text-anchor="middle" font-size="12">${v}</text><text x="${107+i*112}" y="183" font-size="11" text-anchor="middle">${['Material','Transporte','Alimentação'][i]}</text>`).join('')}</svg>`}
function norm(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s/g,'').replace(/\$/g,'').replace(/SUM\(/g,'SOMA(').replace(/AVERAGE\(/g,'MEDIA(')}
function correct(q){let v=state[q[0]];if(practical.includes(q)){let n=norm(v);return n===norm(q[3])||(q[0]==='p1'&&n==='=C2*B2')}return v===q[4]}
function records(){return [
  ...topics.map((t,i)=>['Autoavaliação','Competências gerais',t,state['t'+i]!==undefined&&state['t'+i]!==''?levels[+state['t'+i]]:'Não respondido','']),
  ...concepts.map((c,i)=>['Autoavaliação visual','Reconhecimento de conceitos',c.name,state['c'+i]!==undefined&&state['c'+i]!==''?conceptLevels[+state['c'+i]]:'Não respondido','']),
  ...funcs.map((f,i)=>['Funções conhecidas','Utilizar funções',f[0],state['k'+i]!==undefined&&state['k'+i]!==''?levels[+state['k'+i]]:'Não respondido','']),
  ...visualQs.map(q=>['Desafio visual',q[1],q[2],state[q[0]]||'Não respondido',state[q[0]]?correct(q)?'Correto':state[q[0]]==='Não sei'?'Não sei':'Incorreto':'Não respondido']),
  ...qs.map(q=>['Desafio',q[1],q[2],state[q[0]]||'Não respondido',state[q[0]]?correct(q)?'Correto':state[q[0]]==='Não sei'?'Não sei':'Incorreto':'Não respondido']),
  ...practical.map(q=>['Aplicação',q[1],q[2],state[q[0]]||'Não respondido',state[q[0]]?correct(q)?'Correto':state[q[0]]==='Não sei'?'Não sei':'Incorreto':'Não respondido'])
]}
function report(){let items=[...visualQs,...qs,...practical],done=items.filter(q=>state[q[0]]).length,ok=items.filter(correct).length;return `<div class="finish"><h3>🏁 A tua aventura Excel</h3><p>${allKeys.filter(answered).length*10} XP de participação · ${missionKeys.filter((_,i)=>missionDone(i)).length}/6 missões concluídas</p>${medals.map((m,i)=>`<span class="medal ${missionDone(i)?'':'locked'}">${m} ${missionDone(i)?'✓':'· por concluir'}</span>`).join('')}<p class="muted">Os XP e as medalhas representam participação, não respostas corretas.</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:20px 0">${[['🎯 Pontuação',ok+' / '+items.length],['📊 Aproveitamento',Math.round(100*ok/items.length)+'%'],['✅ Certas',ok],['❌ Incorretas',items.filter(q=>state[q[0]]&&state[q[0]]!=='Não sei'&&!correct(q)).length],['❔ Não sei',items.filter(q=>state[q[0]]==='Não sei').length],['⬜ Em branco',items.length-done]].map(([label,value])=>`<div class="gamebox"><small>${label}</small><b>${value}</b></div>`).join('')}</div><p class="muted">Cada resposta correta vale 1 ponto. A autoavaliação e os XP não contam para a pontuação. A percentagem considera todos os desafios objetivos, incluindo os não respondidos.</p><h2>O teu ponto de partida</h2><p>${esc(state.nome||'Aluno sem nome')} · ${esc(state.turma||'Turma não indicada')} · N.º ${esc(state.numero||'—')}</p><p>Experiência anterior: ${esc(state.experiencia||'Não respondido')}</p><p><b>${ok} respostas corretas / ${done} respondidas</b> · ${items.length-done} por responder · ${items.length} desafios no total.</p><p class="muted">Este resultado é indicativo, não é uma classificação final. Reconhecer uma imagem não significa, por si só, dominar a ferramenta no Excel real.</p><table class="results"><thead><tr><th>Competência</th><th>Autoavaliação</th><th>Evidência</th></tr></thead><tbody>${topics.map((t,i)=>{let group=items.filter(q=>q[1]===t),nAnswered=group.filter(q=>state[q[0]]).length,c=group.filter(correct).length;return `<tr><td>${t}</td><td>${(answered('t'+i)?levels[+state['t'+i]]:'Não respondido')}</td><td>${c}/${nAnswered} corretas · ${group.length-nAnswered} em branco<div class="bar"><i style="width:${nAnswered?100*c/nAnswered:0}%"></i></div></td></tr>`}).join('')}</tbody></table><h3>Conceitos visuais que o aluno diz reconhecer</h3><table class="results"><thead><tr><th>Conceito</th><th>Nível indicado</th></tr></thead><tbody>${concepts.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${(answered('c'+i)?conceptLevels[+state['c'+i]]:'Não respondido')}</td></tr>`).join('')}</tbody></table><h3>Reflexão</h3><p>${esc(state.reflexao||'Não respondido')}</p><h3>Respostas detalhadas</h3><table class="results"><thead><tr><th>Área</th><th>Item</th><th>Resposta</th><th>Resultado</th></tr></thead><tbody>${records().map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('')}</tbody></table><div class="foot no-print"><button onclick="window.print()">Exportar PDF / Imprimir</button><button onclick="exportExcel()">Descarregar Excel (.xlsx)</button></div>`}

const explanations={g1:'Uma célula é a interseção de uma linha com uma coluna.',g2:'Uma linha percorre a folha horizontalmente.',g3:'Uma coluna percorre a folha verticalmente.',g4:'Um intervalo reúne várias células.',g5:'O livro é o documento Excel que contém as folhas.',g6:'A extensão .xlsx identifica um livro Excel.',g7:'SOMA adiciona valores.',g8:'Os separadores permitem alternar entre folhas.',g9:'A caixa de nome apresenta a referência da célula ativa.',g10:'Um gráfico representa dados visualmente.',v1:'A coluna C cruza a linha 3.',v2:'As colunas são identificadas por letras.',v3:'As linhas são identificadas por números.',v4:'O intervalo começa em A2 e termina em B4.',v5:'O nome do livro aparece na barra de título.',v6:'O separador ativo está realçado.',v7:'O sinal + cria uma nova folha.',f1:'Uma fórmula começa pelo sinal =; * representa multiplicação.',f2:'As referências relativas ajustam-se ao copiar a fórmula.',f3:'Os dois sinais $ fixam a coluna e a linha.',f4:'MÉDIA calcula a média aritmética.',f5:'SE testa uma condição.',a1:'Um valor numérico pode ser usado diretamente em cálculos.',a2:'O formato Moeda apresenta valores monetários.',a3:'O formato percentagem apresenta 0,25 como 25%.',a4:'A formatação condicional aplica formatos conforme regras.',a5:'As colunas facilitam a comparação entre categorias.',a6:'A barra de Transporte é a mais alta: 30 euros.',a7:'A extensão habitual de um livro Excel é .xlsx.',a8:'Um filtro oculta temporariamente os dados que não cumprem o critério.',p1:'Multiplica a quantidade pelo preço unitário usando as referências das células.',p2:'SOMA adiciona todos os valores do intervalo D2:D4.',p3:'MÉDIA calcula a média dos valores de D2:D4.'};
function checkAnswer(q,out){if(!state[q[0]]||!String(state[q[0]]).trim()){out.textContent='Responde primeiro ou escolhe «Não sei».';out.className='feedback pending';return}let ok=correct(q);out.className='feedback '+(ok?'good':'retry');out.textContent=(ok?'✓ Correto! +1 ponto de conhecimento. ':'✗ Ainda não está correto. Resposta esperada: '+(practical.includes(q)?q[3]:q[4])+'. ')+(explanations[q[0]]||'');}
function attachChecks(){for(const q of [...visualQs,...qs,...practical]){let el=document.querySelector('#page [name="'+q[0]+'"], #page [data-key="'+q[0]+'"], #page [data-pick="'+q[0]+'"]');if(!el)continue;let parent=el.closest('.galleryQ,.question');if(!parent)continue;let area=document.createElement('div');area.className='checkarea';let b=document.createElement('button');b.type='button';b.className='secondary';b.textContent='Verificar resposta';let out=document.createElement('div');out.setAttribute('aria-live','polite');out.className='feedback';b.onclick=()=>checkAnswer(q,out);area.append(b,out);parent.append(area);parent.addEventListener('input',()=>{out.textContent='';out.className='feedback'});}}

function render(){
  $('nav').innerHTML=names.map((n,i)=>`<button class="${i===step?'active':''}" onclick="go(${i})">${i+1} · ${n}</button>`).join('');
  let html='';
  if(step===0) html=`<span class="pill">35–45 minutos · individual</span><h2>Antes de começar</h2><p>Não precisas de saber tudo. Responde sem pesquisar nem pedir ajuda. Se não souberes, escolhe «Não sei» ou deixa em branco. Podes verificar as respostas dos desafios, ler a explicação e tentar novamente. A pontuação final reflete as respostas atuais.</p><div class="fields"><label>Nome<input data-key="nome" value="${esc(state.nome)}" placeholder="Nome do aluno"></label><label>Turma<select data-key="turma"><option value="">Seleciona a turma</option><option value="9.º A" ${state.turma==='9.º A'?'selected':''}>9.º A</option><option value="9.º B" ${state.turma==='9.º B'?'selected':''}>9.º B</option><option value="9.º C" ${state.turma==='9.º C'?'selected':''}>9.º C</option></select></label><label>Número<input data-key="numero" value="${esc(state.numero)}" placeholder="N.º"></label></div><p>Já utilizaste Excel ou outra folha de cálculo?</p>${radio('experiencia',['Nunca','Algumas vezes','Frequentemente'])}<p class="muted">As respostas ficam neste navegador quando o armazenamento local está disponível. No final, exporta o PDF e o ficheiro Excel e entrega-os à professora.</p>`;
  if(step===1) html='<h2>O que já sabes fazer?</h2><p>Escolhe o nível que melhor descreve o que consegues fazer hoje.</p>'+matrix(topics,'t',levels);
  if(step===2) html='<h2>Galeria visual — O que reconheces?</h2><p>Observa os cartões e indica se conheces cada conceito. Depois responde a alguns mini-desafios visuais.</p><h3>Mini-desafios visuais</h3>'+visualQs.map(visualQuestion).join('')+'<h3 style="margin-top:22px">Autoavaliação visual</h3><div class="cards">'+concepts.map(conceptCard).join('')+'</div>';
  if(step===3) html='<h2>Explorar o Excel</h2><p>Observa as representações simplificadas do Excel e responde.</p>'+sheet()+question(qs[0])+`<div class="question"><strong>${qs[1][2]}</strong>${sheet('v2')}<button class="secondary screen-only" onclick="save('v2','Não sei');render()">Não sei</button><span class="muted"> Seleção: ${esc(state.v2||'—')}</span></div><div class="question"><strong>${qs[2][2]}</strong>${sheet('v3')}<button class="secondary screen-only" onclick="save('v3','Não sei');render()">Não sei</button><span class="muted"> Seleção: ${esc(state.v3||'—')}</span></div>`+sheet('range')+qs.slice(3,7).map(question).join('');
  if(step===4) html='<h2>Fórmulas e funções</h2><p>Indica quais destas funções conheces. Não precisas de as dominar todas.</p>'+matrix(funcs,'k',levels)+'<h3>Consegues reconhecer a opção correta?</h3>'+qs.slice(7,12).map(question).join('');
  if(step===5) html='<h2>Aplica o que sabes</h2><p>Agora vais passar do reconhecimento à aplicação.</p>'+sheet()+practical.map(q=>`<div class="question"><strong>${esc(q[2])}</strong><input data-key="${q[0]}" value="${esc(state[q[0]])}" placeholder="Escreve a fórmula ou Não sei"></div>`).join('')+qs.slice(12).map(q=>`<div class="question">${q[0]==='a6'?chart():''}<strong>${esc(q[2])}</strong>${radio(q[0],q[3])}</div>`).join('')+`<h3>O que gostarias de aprender melhor?</h3><textarea data-key="reflexao" rows="4" placeholder="Escreve aqui as tuas dificuldades, dúvidas ou o que gostarias de praticar mais">${esc(state.reflexao)}</textarea>`;
  if(step===6) html=report();
  $('page').innerHTML=(step<6?`<div class="missionintro screen-only"><h2>${missionIcons[step]} Missão ${step+1} · ${missionTitles[step]}</h2><p>Ganha 10 XP por cada resposta registada. Escolher «Não sei» também conta como participação.</p></div>`:'')+html;$('back').disabled=step===0;$('next').classList.toggle('hide',step===6);updateProgress();attachChecks();
}

function crc(a){let c=~0;for(let b of a){c^=b;for(let i=0;i<8;i++) c=(c>>>1)^((c&1)?0xedb88320:0)}return (~c)>>>0}
function zip(files){let parts=[],central=[],offset=0,cs=0;for(let [name,content] of Object.entries(files)){let n=enc.encode(name),d=enc.encode(content),h=new Uint8Array(30+n.length),v=new DataView(h.buffer),c=crc(d);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,c,true);v.setUint32(18,d.length,true);v.setUint32(22,d.length,true);v.setUint16(26,n.length,true);h.set(n,30);let z=new Uint8Array(46+n.length),w=new DataView(z.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint32(16,c,true);w.setUint32(20,d.length,true);w.setUint32(24,d.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);z.set(n,46);parts.push(h,d);central.push(z);offset+=h.length+d.length;cs+=z.length}let e=new Uint8Array(22),v=new DataView(e.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,central.length,true);v.setUint16(10,central.length,true);v.setUint32(12,cs,true);v.setUint32(16,offset,true);return new Blob([...parts,...central,e],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
